# /etc/nginx/conf.d/boms.conf
# 商机管理系统 (BOMS) 部署 Nginx 配置文件示例

server {
    listen 80;
    server_name localhost; # TODO: 修改为您的服务器公网 IP 或 域名

    # 1. 前端静态资源托管
    location / {
        root /var/www/boms/frontend; # TODO: 修改为解压后的 frontend-dist.zip 文件路径
        index index.html index.htm;
        
        # 核心：支持 Vue HTML5 History 模式路由，防止页面刷新时报 404
        try_files $uri $uri/ /index.html;
    }

    # 2. 后端 API 接口反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/; # 指向 Spring Boot 后端运行端口
        
        # 转发客户端真实 IP 和 Host 信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 调大上传限制以支持大附件上传
        client_max_body_size 50m;
    }
}
