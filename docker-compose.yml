version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: boms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: QtkDvD4N8mXs29Ab
      MYSQL_DATABASE: boms
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pQtkDvD4N8mXs29Ab"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: boms-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boms-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/boms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=QtkDvD4N8mXs29Ab
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - FEISHU_APP_ID=${FEISHU_APP_ID:-cli_aa930a532a78dcbb}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-ApUwfVXA5fAvi2FSvleGLgq2sICGCgaf}
      - FEISHU_REDIRECT_URI=${FEISHU_REDIRECT_URI:-http://localhost:5173/login-callback}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ADMIN_FEISHU_OPENID=${ADMIN_FEISHU_OPENID:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
