server:
  port: 8080

spring:
  application:
    name: opportunity-management
  cache:
    type: simple
  datasource:
    url: jdbc:h2:mem:bomsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: default_secret_change_me_in_prod_!@#123
  expiration-ms: 86400000 # 24 hours

# Feishu (Lark) Integration Settings
feishu:
  app-id: ${FEISHU_APP_ID:cli_aa930a532a78dcbb}
  app-secret: ${FEISHU_APP_SECRET:ApUwfVXA5fAvi2FSvleGLgq2sICGCgaf}
  sandbox-mode: ${FEISHU_SANDBOX_MODE:false}
  redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:5173/login-callback}

