spring:
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/boms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
